apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment2
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: shivsharma01/app-version-v2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service2
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80           # Port exposed by the service
      targetPort: 80     # Port on the Nginx container
      nodePort: 30009    # Port on each Node to access the service
  type: NodePort
