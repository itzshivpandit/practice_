apiVersion: apps/v1
kind: Deployment
metadata:
  name: carvilla-site-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carvilla-site
  template:
    metadata:
      labels:
        app: carvilla-site
    spec:
      containers:
        - name: carvilla-site
          image: shivsharma01/carvilla-site
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: carvilla-site-service
spec:
  type: NodePort
  selector:
    app: carvilla-site
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30090
